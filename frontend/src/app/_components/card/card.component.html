<div class="stats">
  <div
    class="box total-projects"
    [ngClass]="{ selected: cardSelected }"
    [ngStyle]="{
      background: cardSelected !== card ? card.color : '',
      color: 'white'
    }"
    (click)="onCardClick()"
  >
    <p>{{ card.name }}</p>
    <div class="info">
      <div class="flex flex-row justify-center items-center">
        <mat-icon class="mr-5">{{ card.icon }}</mat-icon>
        <span>{{ card.count }}</span>
      </div>
    </div>
  </div>
</div>
