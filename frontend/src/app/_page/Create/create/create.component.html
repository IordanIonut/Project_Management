<mat-card>
  <app-name-page
    [page]="page"
    [type]="type"
    [isHiddenInformation]="isHiddenInformation"
    [isAddHidden]="true"
    [isEditHidden]="true"
    [isDeleteHidden]="true"
    [isBackHidden]="isBackHidden"
    (onType)="onType($event)"
    (onEdit)="onEdit()"
    (onDelete)="onDelete()"
    (onAdd)="onAdd()"
    (onBack)="onBack()"
  ></app-name-page>
  <div
    *ngIf="typeMode === 'add'"
    class="flex flex-row justify-between items-center gap-4"
  >
    <app-card
      class="w-4/12"
      *ngFor="let card of cards"
      [card]="card"
      [cardSelected]="cardSelected"
      (cardClicked)="onCardClick(card)"
    ></app-card>
  </div>

  <app-generate-table
    *ngIf="typeMode === 'edit' || typeMode === 'delete' || !!rowSelected"
    [keys]="keys"
    [type]="type"
    [isHidden]="isTableHidden"
    (eventRow)="onEventRowSelected($event)"
    (eventCard)="onEventCardSelected($event)"
  ></app-generate-table>

  <mat-card
    *ngIf="typeMode === 'add' || !!rowSelected"
    class="flex flex-col items-center self-center m-2 w-10/12"
  >
    <form class="pr-5 pl-5 w-full" [formGroup]="form">
      <app-input
        *ngFor="let config of configs"
        [config]="config"
        [formGroup]="form"
      ></app-input>
      <div class="w-full flex flex-col mb-2 items-center">
        <button
          mat-button
          (click)="onSaveNewInstance()"
          class="flex w-3/12 justify-self-center justify-center bg-gray-900 text-white py-3 rounded-lg hover:bg-gray-700 focus:outline-none"
        >
          Save {{ page.content }}
        </button>
      </div>
    </form>
  </mat-card>
</mat-card>
