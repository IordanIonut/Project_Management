<mat-dialog-content>
  <div class="flex flex-row items-center gap-3 p-4 bg-blue-50 rounded-md mb-4">
    <mat-icon color="primary" class="text-blue-600">info</mat-icon>
    <span
      class="text-base text-blue-900 font-medium"
      [innerHTML]="message"
    ></span>
  </div>

  <div class="flex flex-row items-center gap-3 p-4 bg-blue-50 rounded-md mb-4">
    <app-input [config]="config" [formGroup]="form"></app-input>
  </div>

  <div class="flex justify-center gap-2 mt-4">
    <button
      mat-raised-button
      color="primary"
      class="!bg-blue-600 !text-white hover:!bg-blue-700 transition"
      (click)="onSave()"
    >
      Save
    </button>
    <button
      mat-button
      class="!text-blue-600 hover:!bg-blue-100 transition"
      (click)="onClose(false)"
    >
      Cancel
    </button>
  </div>
</mat-dialog-content>
